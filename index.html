    <main role="main" id="confluenceMain">
      <div id="permissionBanner" style="display: none; background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border: 1px solid #f5c6cb; border-radius: 4px; font-size: 22px; text-align: center; font-weight: bold;">
                Currently GBHS is only fully accessible to GBHS Project collaborators. To access the full site, please request access to the platform.
            </div>
      <div
        class="main-summary-row"
        id="loadingAnimation"
        role="status"
        style="display: none"
      ></div>
      <div class="container">
        <div
          aria-live="polite"
          aria-atomic="true"
          class="row confluence-notification"
        >
          <div id="showNotification"></div>
        </div>

        <div
          class="modal fade"
          id="confluenceMainModal"
          data-bs-keyboard="false"
          data-bs-backdrop="static"
          tabindex="-1"
          role="dialog"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
              <div class="modal-header" id="confluenceModalHeader"></div>
              <div class="modal-body" id="confluenceModalBody"></div>
            </div>
          </div>
        </div>

        <div
          class="modal fade"
          id="bcrppPreviewerModal"
          data-bs-keyboard="false"
          data-bs-backdrop="static"
          tabindex="-1"
          role="dialog"
          aria-hidden="true"
        >
          <div
            class="modal-dialog modal-lg modal-dialog-centered"
            role="document"
            style="height: 800px"
          >
            <div class="modal-content h-100">
              <div class="modal-header" id="bcrppPreviewerModalHeader"></div>
              <div class="modal-body" id="bcrppPreviewerModalBody"></div>
            </div>
          </div>
        </div>

        <div
          class="modal fade"
          id="modalShareFolder"
          data-bs-keyboard="false"
          data-bs-backdrop="static"
          tabindex="-1"
          role="dialog"
          aria-hidden="true"
        >
          <div
            class="modal-dialog modal-lg modal-dialog-centered"
            role="document"
          >
            <div class="modal-content">
              <div class="modal-header allow-overflow">
                <div id="folderToShare"></div>
                <ul class="nav nav-tabs">
                  <li>
                    <button
                      title="Add collaborator(s)"
                      class="nav-link"
                      id="addNewCollaborators"
                    >
                      Add collaborator(s)
                    </button>
                  </li>

                  <li>
                    <button
                      title="All collaborator(s)"
                      class="nav-link"
                      id="listCollaborators"
                    >
                      All collaborator(s)
                    </button>
                  </li>
                </ul>
                <button
                  type="button"
                  title="Close"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                >
                </button>
              </div>

              <div id="collaboratorModalBody"></div>
            </div>
          </div>
        </div>
        <div
          class="modal fade"
          id="modalFileAccessStats"
          data-bs-keyboard="false"
          data-bs-backdrop="static"
          tabindex="-1"
          role="dialog"
          aria-hidden="true"
        >
          <div
            class="modal-dialog modal-lg modal-dialog-centered"
            role="document"
          >
            <div class="modal-content">
              <div
                class="modal-header allow-overflow"
                id="modalFileStatsHeader"
              ></div>
              <div
                class="modal-body allow-overflow"
                id="modalFileStatsBody"
              ></div>
              <div class="modal-footer">
                <button
                  type="button"
                  title="Close"
                  class="btn btn-dark"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="body-min-height" id="confluenceDiv"></div>
